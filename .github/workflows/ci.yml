# Checks every pull request and every push to main: the server's tests, and
# the web app's lint and production build. Nothing here deploys; Vercel and
# Render still deploy main as before.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# One run per ref: a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The Node used to write the lockfiles. npm 10 (Node 22) rejects the
          # client's: it wants the optional peers of @napi-rs/wasm-runtime
          # listed, and npm 11 leaves them out. node --test globs need 22+.
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
